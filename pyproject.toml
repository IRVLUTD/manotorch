[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "manotorch"
version = "0.0.3"
description = "A differentiable PyTorch layer for the MANO hand model"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Lixin Yang", email = "siriusyang@sjtu.edu.cn" }]
maintainers = [{ name = "Jikai Wang", email = "jikai.wang@utdallas.edu" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "torch>=2.0",
    "deprecation",
]

[project.optional-dependencies]
vis = ["open3d", "pyvista", "trimesh", "tqdm"]

[dependency-groups]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/IRVLUTD/manotorch"
Upstream = "https://github.com/lixiny/manotorch"

[tool.setuptools.packages.find]
include = ["manotorch*"]

[tool.uv]
# Pins the development environment only; the published package requires torch>=2.0.
constraint-dependencies = ["torch==2.11.0"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 120
