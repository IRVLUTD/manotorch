name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/tests.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tag and prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/master
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Tag must match package version'
          changelog = pathlib.Path('CHANGELOG.md').read_text()
          marker = f'## [{version}]'
          assert marker in changelog, 'Release must have a changelog entry'
          notes = marker + changelog.split(marker, 1)[1].split('\n## [', 1)[0]
          pathlib.Path('release-notes.md').write_text(notes)
          PY
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Check packaged assets
        run: |
          python - <<'PY'
          import pathlib
          import tarfile
          import zipfile

          wheel, = pathlib.Path('dist').glob('*.whl')
          sdist, = pathlib.Path('dist').glob('*.tar.gz')
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              anchors = [n for n in names if n.startswith('manotorch/assets/anchor/')]
              assert len(anchors) == 4, anchors
              assert any(n.endswith('/licenses/LICENSE') for n in names)
              assert any(n.endswith('/licenses/NOTICE') for n in names)
          with tarfile.open(sdist) as archive:
              names += archive.getnames()
          assert not any('/data/' in n or '/thirdparty/' in n or '/assets/mano/' in n
                         or '/assets/mano_v1_2/' in n or n.endswith(('MANO_LEFT.pkl', 'MANO_RIGHT.pkl',
                                                                   'MANO_LEFT.npz', 'MANO_RIGHT.npz'))
                         for n in names), 'Licensed models or local data found in release artifacts'
          PY
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz --verify-tag --title "manotorch $RELEASE_TAG" --notes-file release-notes.md
