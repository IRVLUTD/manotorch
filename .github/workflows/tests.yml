name: Tests (public CPU coverage)

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.10'
            torch: '2.0.1'
            numpy: 'numpy<2'
          - python: '3.12'
            torch: '2.11.0'
            numpy: 'numpy'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'torch==${{ matrix.torch }}' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '${{ matrix.numpy }}' pytest build
      - run: python -m pip install -e .
      - run: python -m pytest -ra tests scripts/test_benchmark_scripts.py
      - run: python -m build --wheel
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Check installed anchor assets outside the source tree
        working-directory: /tmp
        run: python -c 'from manotorch.anchorlayer import AnchorLayer; assert AnchorLayer().face_vert_idx.shape == (1, 32, 3)'
      - name: Document coverage limits
        run: echo 'Public CI omits licensed MANO models and CUDA. Release validation must run pytest --require-mano with both models and a CUDA device.' >> "$GITHUB_STEP_SUMMARY"
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.16.10
      - run: ruff check .
      - name: Check public release content
        env:
          RELEASE_SOURCE: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') || github.base_ref == 'master' }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import subprocess

          names = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          extensions = {'.py', '.md', '.rst', '.txt', '.yml', '.yaml', '.toml', '.json', '.ipynb', '.lock'}
          cjk = re.compile(r'[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]')
          failures = []
          release_source = os.environ['RELEASE_SOURCE'] == 'true'
          for name in filter(None, names):
              if name == 'doc/review_report.md':
                  if release_source:
                      failures.append(f'{name}: development reports must not enter release source')
                  continue
              if name == 'TODO.md':
                  failures.append(f'{name}: internal records must stay outside version control')
              path = pathlib.Path(name)
              if path.suffix not in extensions and path.name not in {'LICENSE', 'NOTICE'}:
                  continue
              for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if cjk.search(line):
                      failures.append(f'{name}:{number}: CJK text found in public source documentation')
          assert not failures, '\n'.join(failures)
          print('Public release content check passed')
          PY
